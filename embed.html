<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝓚.𝓢 𝓐𝓵𝓵𝓲𝓪𝓷𝓬𝓮</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #131314;
    color: #e8eaed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.embed-card {
    width: 100%;
    max-width: 450px;
    background: #1f1f1f;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #3c4043;
    transition: all 0.3s ease;
}

.embed-card:hover {
    border-color: #5f6368;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.card-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #3c4043;
}

.site-url {
    font-size: 0.85rem;
    color: #9aa0a6;
    display: flex;
    align-items: center;
    gap: 6px;
}

.site-icon {
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 3px;
}

.card-main {
    padding: 16px;
    display: flex;
    gap: 16px;
}

.card-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.card-title {
    font-size: 1.1rem;
    font-weight: 500;
    color: #e8eaed;
    margin-bottom: 4px;
    font-family: Georgia, 'Times New Roman', Times, serif;
}

.card-logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-family: Georgia, 'Times New Roman', Times, serif;
    color: #ffd700;
    font-weight: bold;
    letter-spacing: -2px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
}

.card-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}

a {
    text-decoration: none;
    display: block;
}

a:hover .embed-card {
    border-color: #8ab4f8;
}

a:hover .card-title {
    color: #8ab4f8;
}
    </style>
</head>
<body>
    <a href="index.html" id="embedLink">
        <div class="embed-card">
            <div class="card-header">
                <div class="site-url">
                    <svg class="site-icon" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="14" height="14" rx="3" fill="white"/>
                        <path d="M4 3h6v8H4V3z" fill="#4285F4"/>
                        <path d="M4 3h3v8H4V3z" fill="#EA4335"/>
                        <path d="M4 6h6v5H4V6z" fill="#FBBC05"/>
                        <path d="M4 6h3v5H4V6z" fill="#34A853"/>
                    </svg>
                    <span id="siteUrl">https://sites.google.com/view/ks-alliance</span>
                </div>
            </div>
            <div class="card-main">
                <div class="card-info">
                    <div class="card-title" id="cardTitle">𝓚.𝓢 𝓐𝓵𝓵𝓲𝓪𝓷𝓬𝓮</div>
                </div>
                <div class="card-logo" id="cardLogo">
                    <span>KS</span>
                </div>
            </div>
        </div>
    </a>

    <script>
function loadSettings() {
    const logoUrl = localStorage.getItem('teamLogoUrl') || '';
    const cardTitle = localStorage.getItem('embedTitle') || '𝓚.𝓢 𝓐𝓵𝓵𝓲𝓪𝓷𝓬𝓮';
    const siteUrl = localStorage.getItem('embedUrl') || 'https://sites.google.com/view/ks-alliance';
    const linkUrl = localStorage.getItem('embedLink') || 'index.html';
    
    document.getElementById('cardTitle').textContent = cardTitle;
    document.getElementById('siteUrl').textContent = siteUrl;
    document.getElementById('embedLink').href = linkUrl;
    
    if (logoUrl) {
        document.getElementById('cardLogo').innerHTML = '<img src="' + logoUrl + '" alt="KS Logo">';
    }
}
loadSettings();
    </script>
</body>
</html>
